<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Browser Guard MCP demo terminal</title>
  <desc id="desc">A terminal shows a public page opening, a loopback route being denied, and the local test server receiving zero requests.</desc>
  <rect width="920" height="300" rx="18" fill="#111318"/>
  <rect x="0.5" y="0.5" width="919" height="299" rx="17.5" fill="none" stroke="#2a2f3a"/>
  <circle cx="34" cy="30" r="7" fill="#ff5f57"/>
  <circle cx="56" cy="30" r="7" fill="#febc2e"/>
  <circle cx="78" cy="30" r="7" fill="#28c840"/>
  <text x="34" y="86" fill="#8b93a7" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">$ node demo/blocked.cjs</text>
  <text x="34" y="128" fill="#e6e8ee" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">public page: <tspan fill="#7ee787">https://example.com/</tspan> via chrome</text>
  <text x="34" y="170" fill="#e6e8ee" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">loopback: <tspan fill="#ff7b72">NETWORK_DENIED</tspan></text>
  <text x="34" y="212" fill="#e6e8ee" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">local server requests: <tspan fill="#7ee787">0</tspan></text>
  <text x="34" y="258" fill="#8b93a7" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">the request never reached the local service</text>
</svg>
